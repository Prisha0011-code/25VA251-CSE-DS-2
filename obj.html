<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBJECT JS</title>
</head>
<body>
    <script>
        let Pisha=["Prisha",19,false];
        console.log(Pisha);
        let student={
            name:"Prisha",
            age:19,
            isMarried:false
        };
        console.log(student);
        for(let i=0;i<Prisha.length;i++){
            console.log(Prisha[i]);
        }
        let i=0;
        while(i<Prisha.length){
            console.log(Prisha[i]);
            i++;
        }
    </script>
</body>
</html>
