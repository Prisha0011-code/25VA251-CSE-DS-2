<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOOPS IN JS</title>
</head>
<body>
    <script>
//JavaScript provides several types of loops to repeatedly execute a block
// of code until a condition is met.
//for loop
let studentList=["Krishna","Anshika","Sneha","Prisha","Siddharth"];
for(let i=0;i<studentList.length;i++){
    console.log(studentList[i]);
}
//while loop
let i=0;
while(i<studentList.length){
    console.log(studentList[i]);
    i++;}
    //for..of loop
    //The for..of loop is used to iterate over iterable objects like arrays,
    //  strings, maps, sets, etc.
    for(let student of studentList){
        console.log(student);
    }
    </script>
</body>
</html>
