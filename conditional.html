<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUM AVG JS</title>
</head>
<body>
    <script>
        let grades=[95,90,88,92,98];
        let sum=0;
        for(let i=0;i<grades.length;i++){
            sum+=grades[i];
        }
        let avg=sum/grades.length;
        if(avg>=90){
            console.log("Grade: A");
        }else if(avg>=80){
            console.log("Grade: B");
        }else if(avg>=70){
            console.log("Grade: C");
        }else{
            console.log("Grade: Fail");
        }
        console.log("Sum: "+sum);
        console.log("Average: "+avg);
    </script>
</body>
</html>
